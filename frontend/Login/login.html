<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Missipy Login</title>
  <link rel="icon" href="../media/App%20Logo-svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../common/common.css?v=28">
  <link rel="stylesheet" href="../Signup/signup.css?v=26">
  <link rel="stylesheet" href="../common/mobile.css?v=28">
</head>
<body class="auth-body">
  <main class="auth-shell" aria-label="Login">
    <section class="auth-card">
      <div class="auth-card__brand">
        <span class="brand__logo" aria-hidden="true"><i class="fa-solid fa-file-invoice-dollar"></i></span>
        <div>
          <h1>Missipy</h1>
          <p>Sign in to your business workspace</p>
        </div>
      </div>

      <form class="auth-form" action="../Dashboard/dashboard.html" method="get">
        <label class="customer-field">
          <span>Username</span>
          <input type="text" name="username" placeholder="Enter username" autocomplete="username">
        </label>
        <label class="customer-field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Enter password" autocomplete="current-password">
        </label>
        <button class="customer-save-button auth-submit" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Sign In</span>
        </button>
      </form>

      <p class="auth-switch">
        First time here?
        <a href="../Signup/signup.html">Sign up</a>
      </p>
    </section>
  </main>
</body>
</html>
